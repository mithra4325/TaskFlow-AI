{% extends 'myapp/base.html' %}

{% block title %}Edit Support Ticket {{ ticket.reference }} — TaskFlow AI{% endblock %}

{% block content %}
<div class="support-page-wrapper">
    <div class="card form-card-expanded" style="max-width: 680px; margin: 2rem auto;">
        <div class="card-header-line">
            <div>
                <h1 class="card-section-title">Edit Ticket: {{ ticket.reference }}</h1>
                <p class="page-subtitle">Update your inquiry details or ticket status.</p>
            </div>
            <a href="{% url 'support' %}?lookup_ref={{ ticket.reference }}" class="btn btn-secondary">
                &larr; Back to Ticket
            </a>
        </div>

        <form method="POST" action="{% url 'ticket_update' ticket.reference %}" class="support-ticket-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_subject" class="form-label">Subject <span class="required">*</span></label>
                <input type="text" name="subject" id="id_subject" class="form-control" value="{{ ticket.subject }}" required maxlength="255">
            </div>

            <div class="form-group">
                <label for="id_status" class="form-label">Status</label>
                <select name="status" id="id_status" class="form-control">
                    {% for code, label in status_choices %}
                        <option value="{{ code }}" {% if ticket.status == code %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="id_description" class="form-label">Description <span class="required">*</span></label>
                <textarea name="description" id="id_description" rows="5" class="form-control" required>{{ ticket.description }}</textarea>
            </div>

            <div class="form-actions" style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
                <a href="{% url 'support' %}?lookup_ref={{ ticket.reference }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary" id="btn-save-ticket">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
